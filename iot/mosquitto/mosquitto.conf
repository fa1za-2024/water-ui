# =============================================================================
# Water UI - Mosquitto broker
# Mounted at /mosquitto/config/mosquitto.conf (see ../docker-compose.yml)
# =============================================================================

# --- Persistence ------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# --- Logging ----------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
# Local-time timestamps. This is the correct directive name; the bare
# `timestamp_format` used in older examples is rejected by Mosquitto >= 2.1.
log_timestamp_format %Y-%m-%d %H:%M:%S

# =============================================================================
# Listener 1 - MQTT (the XIAO ESP32C3 and Node-RED connect here)
#
# The address MUST be 0.0.0.0. Mosquitto 2.x binds to localhost only by
# default, which would make the broker unreachable from the ESP32.
# =============================================================================
listener 1883 0.0.0.0

# --- DEV ONLY: anonymous access ---------------------------------------------
# Anyone who can reach port 1883 can publish/subscribe. Acceptable on a trusted
# local network; NOT acceptable if this host is internet-facing.
allow_anonymous true

# --- To require a username/password instead --------------------------------
# 1. Generate the file from this directory (writes into iot/mosquitto/):
#      docker compose exec mosquitto \
#        mosquitto_passwd -b -c /mosquitto/config/passwd waterui <PASSWORD>
# 2. Comment out `allow_anonymous true` above and uncomment the line below.
# 3. Uncomment `password_file` and restart:
#      docker compose restart mosquitto
#    Then set MQTT_USER / MQTT_PASSWORD in the ESP32 sketch.
# password_file /mosquitto/config/passwd

# =============================================================================
# Listener 2 - MQTT over WebSockets (for browser clients)
# Published on host port 9002 - MinIO's console already uses 9001.
# =============================================================================
listener 9001 0.0.0.0
protocol websockets
