# =============================================================================
# Water UI - Mosquitto broker for Railway
#
# Mounted at /mosquitto/config/mosquitto.conf. This is now the only production
# broker config in the repository - the previous self-hosted (OCI) one was
# retired. Its TLS listener is replaced because Railway's TCP proxy is RAW TCP
# and does not terminate TLS, and no certificate can be issued for a
# *.railway.app hostname you do not control. Listener 1884 is therefore
# plaintext-but-authenticated. Read the deploy guide's security note before
# pointing field devices at it.
#
# TWO LISTENERS WITH DIFFERENT TRUST LEVELS
#
#   1883  plaintext, ANONYMOUS  - Railway PRIVATE network only, never proxied.
#                                 Node-RED and the backend simulator reach the
#                                 broker here, exactly like the compose network.
#   1884  plaintext, PASSWORD   - exposed by the Railway TCP proxy; the field
#                                 ESP32C3 devices connect here.
#
# `password_file` is not listener-prefixed, so it applies to both listeners; the
# `listener_allow_anonymous true` on 1883 is what keeps Node-RED and the
# simulator working without credentials, while 1884 refuses anonymous clients.
# =============================================================================

# --- Global -------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
# The bare `timestamp_format` used in older examples is rejected by >= 2.1.
log_timestamp_format %Y-%m-%d %H:%M:%S

# A device that drops off mid-publish should be told, not left half-open.
max_keepalive 120

# =============================================================================
# Listener 1 - internal plaintext (Railway private network only)
#
# The address must stay 0.0.0.0: Node-RED and the backend are separate Railway
# services, so binding 127.0.0.1 would make the broker unreachable.
# =============================================================================
listener 1883 0.0.0.0

listener_allow_anonymous true

# =============================================================================
# Listener 2 - field devices, published through the Railway TCP proxy
#
# Enable the proxy in the Railway dashboard: Mosquitto service -> Settings ->
# Networking -> TCP Proxy -> target port 1884. Railway then exposes
# RAILWAY_TCP_PROXY_DOMAIN:RAILWAY_TCP_PROXY_PORT, which is what the ESP32C3
# sketch connects to (MQTT_USE_TLS=0, MQTT_USER/MQTT_PASSWORD set).
#
# The password file is generated at container start from the MQTT_USERNAME /
# MQTT_PASSWORD service variables - see start.sh - so the hash is never
# committed and rotating the variable rotates the credential.
# =============================================================================
listener 1884 0.0.0.0

listener_allow_anonymous false
password_file /mosquitto/passwd/passwd
